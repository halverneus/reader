<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20243a"/><stop offset="1" stop-color="#0f1120"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6280"/><stop offset="1" stop-color="#2e3348"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fc9c0" stop-opacity=".55"/><stop offset="1" stop-color="#e8a830" stop-opacity=".35"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="clip"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
  </defs>
  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <g clip-path="url(#clip)">
    <!-- faint wall rail + arm hint on the left, like the on-screen rig -->
    <rect x="0" y="0" width="14" height="512" fill="#2a2f40"/>
    <g stroke="#3a4158" stroke-width="18" stroke-linecap="round"><line x1="14" y1="330" x2="86" y2="262"/><line x1="86" y1="262" x2="150" y2="300"/></g>
    <circle cx="86" cy="262" r="14" fill="#3a3f55" stroke="#5a6280" stroke-width="3"/>
    <!-- eye glow halo -->
    <ellipse cx="270" cy="250" rx="150" ry="70" fill="#3fc9c0" opacity=".25" filter="url(#soft)"/>
    <!-- head, Vex geometry scaled 1.5 about (270,250) -->
    <g transform="translate(270,250) scale(1.5)">
      <!-- fins -->
      <g transform="translate(-100,34) rotate(8.5)"><path d="M0,0 L-30,-112 L40,-56 Z" fill="url(#metal)" stroke="#6a7290" stroke-width="2"/><path d="M-4,-20 L-18,-76 L18,-46 Z" fill="#3fc9c0" filter="url(#glow)" opacity=".9"/></g>
      <g transform="translate(100,34) rotate(-8.5)"><path d="M0,0 L30,-112 L-40,-56 Z" fill="url(#metal)" stroke="#6a7290" stroke-width="2"/><path d="M4,-20 L18,-76 L-18,-46 Z" fill="#3fc9c0" filter="url(#glow)" opacity=".9"/></g>
      <!-- neck stub -->
      <rect x="-16" y="60" width="32" height="50" rx="6" fill="#252a38"/>
      <!-- helmet -->
      <path d="M-106,-36 L-74,-104 L74,-104 L106,-36 L106,54 L74,100 L-74,100 L-106,54 Z" fill="url(#metal)" stroke="#6a7290" stroke-width="2.5"/>
      <path d="M-52,-104 L-36,-124 L36,-124 L52,-104 Z" fill="#3a3f55"/>
      <rect x="-20" y="-120" width="40" height="6" rx="3" fill="#3fc9c0" filter="url(#glow)"/>
      <!-- visor -->
      <path d="M-96,-40 L96,-40 L96,36 L-96,36 Z" fill="#0c0f17" stroke="#1e2230" stroke-width="4"/>
      <path d="M-88,-34 L88,-34" stroke="#ffffff" stroke-opacity=".08" stroke-width="4"/>
      <!-- eyes -->
      <g transform="translate(0,-4)">
        <g transform="translate(-44,0)">
          <rect x="-38" y="-28" width="76" height="56" rx="21" fill="#3fc9c0" opacity=".35" filter="url(#soft)"/>
          <rect x="-28" y="-18" width="56" height="36" rx="11" fill="#3fc9c0"/>
          <circle cx="0" cy="0" r="15" fill="#000" opacity=".25"/><circle cx="0" cy="0" r="9.5" fill="#070910"/><circle cx="-6" cy="-5" r="3.4" fill="#fff" opacity=".85"/>
          <line x1="25" y1="-30" x2="-25" y2="-30" stroke="#3fc9c0" stroke-width="6" stroke-linecap="round"/>
        </g>
        <g transform="translate(44,0)">
          <rect x="-38" y="-28" width="76" height="56" rx="21" fill="#3fc9c0" opacity=".35" filter="url(#soft)"/>
          <rect x="-28" y="-18" width="56" height="36" rx="11" fill="#3fc9c0"/>
          <circle cx="0" cy="0" r="15" fill="#000" opacity=".25"/><circle cx="0" cy="0" r="9.5" fill="#070910"/><circle cx="-6" cy="-5" r="3.4" fill="#fff" opacity=".85"/>
          <line x1="-25" y1="-30" x2="25" y2="-30" stroke="#3fc9c0" stroke-width="6" stroke-linecap="round"/>
        </g>
      </g>
      <!-- chin plate + smile -->
      <path d="M-74,46 L74,46 L56,90 L-56,90 Z" fill="#1e2230"/>
      <path d="M-42,60 Q0,86 42,60" fill="none" stroke="#3fc9c0" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    </g>
  </g>
</svg>
